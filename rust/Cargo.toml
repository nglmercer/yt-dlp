[workspace]
members = [
    "crates/ytdlp-core",
    "crates/ytdlp-cli",
    "crates/ytdlp-downloader",
    "crates/ytdlp-extractor",
  "crates/ytdlp-networking",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Unlicense"

[workspace.dependencies]
cookie_store = { version = "0.22", features = ["preserve_order"] }
fancy-regex = "0.18"
indexmap = { version = "2.0", features = ["serde"] }
quick-xml = "0.41"
regex = "1.0"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "brotli",
  "deflate",
  "gzip",
  "rustls-tls",
  "socks",
  "zstd",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.0"
